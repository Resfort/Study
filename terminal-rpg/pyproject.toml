[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-rpg"
version = "0.1.0"
description = "Модульная Terminal RPG на Python 3.15"
requires-python = ">=3.15"
dependencies = [
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[project.scripts]
rpg = "rpg.main:run_game"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.15"
strict = true
