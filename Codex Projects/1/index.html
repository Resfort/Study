<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Маме с любовью</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="Пиксельная открытка для мамы">
      <div class="sky" aria-hidden="true">
        <span class="cloud cloud-a"></span>
        <span class="cloud cloud-b"></span>
        <span class="cloud cloud-c"></span>
      </div>

      <section class="card">
        <div class="pixel-frame" aria-hidden="true">
          <div class="sun"></div>
          <div class="house">
            <span class="roof"></span>
            <span class="wall"></span>
            <span class="door"></span>
            <span class="window window-left"></span>
            <span class="window window-right"></span>
          </div>
          <div class="garden">
            <span class="flower flower-1"></span>
            <span class="flower flower-2"></span>
            <span class="flower flower-3"></span>
            <span class="flower flower-4"></span>
          </div>
          <div class="heart heart-big"></div>
          <div class="heart heart-small"></div>
        </div>

        <div class="message">
          <p class="eyebrow">самой любимой</p>
          <h1>Мамочка,<br /><span>с праздником!</span></h1>
          <p class="lead">
            Пусть каждый день будет мягким, светлым и добрым, как это маленькое
            пиксельное утро. Спасибо за тепло, заботу и любовь, которые всегда
            делают дом домом.
          </p>
          <button class="love-button" type="button" aria-label="Добавить сердечки">
            <span aria-hidden="true">♥</span>
            Нажми для обнимашки
          </button>
        </div>
      </section>

      <div class="ground" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
